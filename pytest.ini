[pytest]
addopts = -v
testpaths = tests
# Deliberately does NOT include Case_*.py: those scripts run a full RVE generation as a bare
# top-level statement on import, with no test function and no fixtures applied (they're only ever
# meant to be exercised via tests/scenarios/run_all_test_cases.py's importlib-based curated
# subset). Auto-discovering them directly would make a bare `pytest` run each one as an import
# side effect, uncleaned, before finding zero actual test items inside any of them.
python_files = test_*.py run_all_test_cases.py
